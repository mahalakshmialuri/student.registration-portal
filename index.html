<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Portal</title>
    </head>

    <body>
        <h1>Welcome to Student Registration Portal</h1>
        <h2>Personal Details</h2>
        
        <form action="register.php" method="post" enctype="multipart/form-data">

            <!--Personal Details-->

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            <br><br>

            <label for="mail">Email Address:</label>
            <input type="email" id="mail" name="mail" placeholder="Enter your email address" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" placeholder="Enter your password" required>
            <br><br>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" maxlength="10" placeholder="Enter your mobile number" required>
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="35">
            <br><br>


            <h3>Gender:</h3>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <br><br>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
            <br><br>

            <!--Academic Details-->

            <h2>Academic Details</h2>

            <label for="qualification">Qualification</label>
            <select id="qualification" name="qualification" required>
                <option value="" selected disabled>Choose Qualification</option>
                <option value="ssc">SSC</option>
                <option value="inter">Intermediate</option>
                <option value="diploma">Diploma</option>
                <option value="graduation">Graduation</option>
            </select>
            <br><br>

            <label for="college">College Name:</label>
            <input type="text" id="college" name="college" placeholder="Enter your college name" required>
            <br><br>

            <label for="course">Course</label>
            <select id="course" name="course" required>
                <option value="" selected disabled>Choose Course</option>
                <option value="btech">B.Tech</option>
                <option value="bsc">B.Sc</option>
                <option value="bcom">B.Com</option>
                <option value="bba">BBA</option>
            </select>
            <br><br>

            <label for="passedout">Year of Passing</label>
            <input type="number" id="passedout" name="passedout" min="2020" max="2026" required>
            <br><br>

            <!--Skills and Interest-->

            <h3>Programming Languages</h3>

            <input type="checkbox" id="c" name="languages[]" value="c">
            <label for="c">C</label>
            <br><br>

            <input type="checkbox" id="python" name="languages[]" value="python">
            <label for="python">Python</label>
            <br><br>

            <input type="checkbox" id="java" name="languages[]" value="java">
            <label for="java">Java</label>
            <br><br>

            <input type="checkbox" id="javascript" name="languages[]" value="javascript">
            <label for="javascript">JavaScript</label>
            <br><br>

            <h3>Technical Skills</h3>

            <input type="checkbox" id="html" name="skills[]" value="html">
            <label for="html">HTML</label>
            <br><br>

            <input type="checkbox" id="sql" name="skills[]" value="sql">
            <label for="sql">SQL</label>
            <br><br>

            <input type="checkbox" id="embedded" name="skills[]" value="embedded">
            <label for="embedded">Embedded Systems</label>
            <br><br>

            <input type="checkbox" id="vlsi" name="skills[]" value="vlsi">
            <label for="vlsi">VLSI</label>
            <br><br>

            <h3>Preferred Job Role</h3>

            <input type="radio" id="software" name="role" value="software">
            <label for="software">Software Developer</label>
            <br><br>

            <input type="radio" id="web" name="role" value="web">
            <label for="web">Web Developer</label>
            <br><br>

            <input type="radio" id="embdeng" name="role" value="embdeng">
            <label for="embdeng">Embedded Engineer</label>
            <br><br>

            <input type="radio" id="vlsieng" name="role" value="vlsieng">
            <label for="vlsieng">VLSI Engineer</label>
            <br><br>

            <h3>Hobbies</h3>

            <input type="checkbox" id="read" name="hobbies[]" value="read">
            <label for="read">Reading</label>
            <br><br>

            <input type="checkbox" id="draw" name="hobbies[]" value="draw">
            <label for="draw">Drawing</label>
            <br><br>

            <input type="checkbox" id="music" name="hobbies[]" value="music">
            <label for="music">Music</label>
            <br><br>

            <input type="checkbox" id="sports" name="hobbies[]" value="sports">
            <label for="sports">Sports</label>
            <br><br>

            <!--Address Details-->

            <h3>Address Details</h3>

            <label for="doornumber">Door Number:</label>
            <input type="text" id="doornumber" name="doornumber" placeholder="Enter your door number" required>
            <br><br>

            <label for="area">Street/Area:</label>
            <input type="text" id="area" name="area" placeholder="Enter your street or area" required>
            <br><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="Enter your city" required>
            <br><br>

            <label for="state">State:</label>
            <select id="state" name="state" required>
                <option value="" selected disabled>Choose State</option>
                <option value="AP">Andhra Pradesh</option>
                <option value="TS">Telangana</option>
                <option value="KA">Karnataka</option>
                <option value="TN">Tamil Nadu</option>
                <option value="KE">Kerala</option>
            </select>
            <br><br>

            <label for="pincode">Pincode:</label>
            <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6" required>
            <br><br>

            <!--Additional Details-->

            <h3>Additional Details</h3>

            <label for="aboutself">About Yourself:</label>
            <textarea id="aboutself" name="aboutself" rows="4" cols="40" placeholder="Tell us about Yourself" required></textarea>
            <br><br>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf">
            <br><br>

            <input type="checkbox" id="declaration" name="declaration" value="accepted" required>
            <label for="declaration">I confirm that the information provided is correct.</label>
            <br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        </form>
    </body>
</html>
